[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geneicl"
version = "1.0.0"
description = "In-context learning for bulk gene expression: classification, regression and survival with one model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]   # torch 2.4: nn.RMSNorm

[tool.setuptools]
packages = ["geneicl"]                   # eval/ (the manuscript reproduction) is not part of the package

[tool.setuptools.package-data]
# seed 0 of each checkpoint family, 25 MB each (all seeds: in the repository; PyPI caps a file at 100 MB)
geneicl = ["checkpoints/C20RFbal_s0.pt", "checkpoints/R20RFs20Yv_s0.pt", "checkpoints/trm_segmented8_s0.pt"]
