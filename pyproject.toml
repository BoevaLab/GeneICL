[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geneicl"
version = "0.1.0"
description = "In-context learning for bulk gene expression: classification, regression and survival with one model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]   # torch 2.4: nn.RMSNorm

[tool.setuptools]
packages = ["geneicl"]                   # eval/ (the manuscript reproduction) is not part of the package

[tool.setuptools.package-data]
geneicl = ["checkpoints/*.pt"]           # the three released checkpoints, 25 MB each
